# docker-compose.yml

services:
  database:
    image: mongo:latest
    container_name: photographers_story_db
    ports:
      - "5002:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  storage:
    image: minio/minio:latest
    container_name: photographers_story_storage
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Console Port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
  minio_data:
    driver: local
